name: ${COMPOSE_PROJECT_NAME:-wuxu}

x-node-service: &node-service
  build:
    context: .
    dockerfile: Dockerfile.dev
    target: development
  image: wuxu/node-dev:22.20.0-pnpm10.18.3
  working_dir: /workspace
  init: true

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wuxu}
      MYSQL_USER: ${MYSQL_USER:-wuxu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wuxu_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wuxu_root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.14
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:3.94
    command: "server -dir=/data -s3 -s3.port=8333 -volume.max=20"
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    <<: *node-service
    command: pnpm --filter @wuxu/api start:dev
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /workspace/apps/api/src
        - action: sync+restart
          path: ./packages/shared-types/src
          target: /workspace/packages/shared-types/src
    environment:
      NODE_ENV: development
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wuxu}
      MYSQL_USER: ${MYSQL_USER:-wuxu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wuxu_dev_password}
      MYSQL_SYNCHRONIZE: "true"
      MONGODB_URI: mongodb://mongodb:27017/wuxu
      S3_ENDPOINT: http://object-storage:8333
      S3_REGION: us-east-1
      S3_BUCKET: wuxu-items
      S3_ACCESS_KEY: wuxu-dev
      S3_SECRET_KEY: wuxu-dev-secret
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-at-least-32-random-characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      SEED_DEV_USERS: ${SEED_DEV_USERS:-true}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-user@wuxu.local}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-wuxu-user-123456}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@wuxu.local}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-wuxu-admin-123456}
    ports:
      - "${API_PORT:-3100}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  user-web:
    <<: *node-service
    command: pnpm --filter @wuxu/user-web dev --host 0.0.0.0
    develop:
      watch:
        - action: sync
          path: ./apps/user-web/src
          target: /workspace/apps/user-web/src
        - action: sync+restart
          path: ./packages/shared-types/src
          target: /workspace/packages/shared-types/src
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${USER_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    <<: *node-service
    command: pnpm --filter @wuxu/admin-web dev --host 0.0.0.0
    develop:
      watch:
        - action: sync
          path: ./apps/admin-web/src
          target: /workspace/apps/admin-web/src
        - action: sync+restart
          path: ./packages/shared-types/src
          target: /workspace/packages/shared-types/src
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_BASE_PATH: /
    ports:
      - "${ADMIN_WEB_PORT:-5174}:5174"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
  object_data:

